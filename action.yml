name: "Imed Cortex Action"
description: "Uploads security scan reports to Imed Cortex platform"
branding:
  icon: "upload"
  color: "blue"

# IMPORTANT: Before using this action, ensure:
# 1. The cortex-uploader image is pushed to ghcr.io/cguajardo-imed/cortex-uploader:latest
# 2. The package visibility is set to public OR
# 3. The package has been granted access to repositories that will use this action
# 4. If using private packages across orgs, use a PAT with read:packages scope instead of github.token

inputs:
  endpoint_url:
    description: "Full endpoint URL for Imed Cortex"
    required: true
  api_key:
    description: "API key for authentication"
    required: true
  report_path:
    description: "Path to the security scan report file"
    required: true
  github_token:
    description: |
      GitHub token for authenticating with GHCR.
      - The token must have permission to pull from ghcr.io/cguajardo-imed/cortex-uploader
    required: false
    default: ${{ github.token }}
  registry_username:
    description: "Container registry username (uses github.actor by default)"
    required: false
    default: ${{ github.actor }}

outputs:
  success:
    description: "Indicates if report upload was successful"
    value: ${{ steps.upload.outputs.success }}
  message:
    description: "Detailed message about the upload result"
    value: ${{ steps.upload.outputs.message }}

runs:
  using: composite
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.github_token }}

    - name: Pull Cortex Uploader Image
      shell: bash
      run: |
        echo "🐳 Pulling cortex-uploader image..."
        if ! docker pull ghcr.io/cguajardo-imed/cortex-uploader:latest; then
          echo "❌ Failed to pull image. Common causes:"
          echo "   - Image doesn't exist at ghcr.io/cguajardo-imed/cortex-uploader:latest"
          echo "   - Image is private and token lacks read:packages permission"
          echo "   - Package hasn't been granted access to this repository"
          exit 1
        fi
        echo "✅ Image pulled successfully"

    - name: Upload Report to Cortex
      id: upload
      shell: bash
      run: |
        echo "📤 Uploading report to Imed Cortex..."

        # Run the container with the required environment variables
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -e REPORT_PATH="/workspace/${{ inputs.report_path }}" \
          -e API_KEY="${{ inputs.api_key }}" \
          -e ENDPOINT_URL="${{ inputs.endpoint_url }}" \
          ghcr.io/cguajardo-imed/cortex-uploader:latest

        # Capture exit code
        EXIT_CODE=$?

        if [ $EXIT_CODE -eq 0 ]; then
          echo "✅ Report uploaded successfully"
          echo "success=true" >> $GITHUB_OUTPUT
          echo "message=Report uploaded successfully" >> $GITHUB_OUTPUT
        else
          echo "❌ Report upload failed with exit code: $EXIT_CODE"
          echo "success=false" >> $GITHUB_OUTPUT
          echo "message=Report upload failed with exit code: $EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        fi
