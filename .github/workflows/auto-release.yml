name: Auto-Release

on:
  # Option 1: Manual trigger with version bump control
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

  # Option 2: Auto-trigger on pushes that modify core files
  push:
    branches:
      - main
    paths:
      - "action.yml"
      # Exclude documentation and config files
      - "!**.md"
      - "!.github/**"
      - "!test.*"

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for tag lookup

      - name: Check for skip release flag
        id: check_skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qiE '\[skip[ -]?release\]|\[no[ -]?release\]'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping release due to [skip release] in commit message"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest version and calculate new version
        if: steps.check_skip.outputs.skip != 'true'
        id: get_version
        run: |
          # Get the latest semver tag (exclude 'latest' and non-semver tags)
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "📌 Latest tag: $LATEST_TAG"

          # Remove the 'v' prefix to work with semver
          LATEST_VERSION=${LATEST_TAG#v}

          # Split into parts (handle missing parts gracefully)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          echo "Current version: $MAJOR.$MINOR.$PATCH"

          # Determine bump type (from manual input or default to patch)
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          if [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE="patch"
          fi

          # Calculate new version based on bump type
          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "❌ Invalid bump type: $BUMP_TYPE"
              exit 1
              ;;
          esac

          # Create new version string
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"

          # Check if tag already exists
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "⚠️ Tag $NEW_VERSION already exists!"
            echo "This might be a race condition or duplicate run."
            exit 1
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "BUMP_TYPE=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "✅ New version will be: $NEW_VERSION (bump: $BUMP_TYPE)"

      - name: Check if version changed
        if: steps.check_skip.outputs.skip != 'true'
        id: check_changes
        run: |
          # Verify we actually have a new version
          if [ -z "${{ steps.get_version.outputs.NEW_VERSION }}" ]; then
            echo "❌ Failed to calculate new version"
            exit 1
          fi
          echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_skip.outputs.skip != 'true' && steps.check_changes.outputs.changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.NEW_VERSION }}
          name: Release ${{ steps.get_version.outputs.NEW_VERSION }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 🚀 Release ${{ steps.get_version.outputs.NEW_VERSION }}

            **Version Bump:** ${{ steps.get_version.outputs.BUMP_TYPE }}
            **Triggered by:** ${{ github.event_name }}
            **Commit:** ${{ github.sha }}

            ### Changes
            Auto-generated release notes below include all changes since the last release.

            ---

      - name: Update 'latest' tag
        if: steps.check_skip.outputs.skip != 'true' && steps.check_changes.outputs.changes == 'true' && github.event.inputs.prerelease != 'true'
        run: |
          echo "🏷️ Updating 'latest' tag to point to ${{ steps.get_version.outputs.NEW_VERSION }}"

          # Delete the 'latest' tag locally if it exists
          git tag -d latest 2>/dev/null || true

          # Create new 'latest' tag pointing to current commit
          git tag latest

          # Force push the 'latest' tag to remote
          git push origin latest --force

          echo "✅ 'latest' tag updated successfully"

      - name: Release Summary
        if: steps.check_skip.outputs.skip != 'true' && steps.check_changes.outputs.changes == 'true'
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump Type:** ${{ steps.get_version.outputs.BUMP_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release:** ${{ github.event.inputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View the release: [${{ steps.get_version.outputs.NEW_VERSION }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.NEW_VERSION }})" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.prerelease }}" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**'latest' tag:** Updated to point to this release" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Skip Summary
        if: steps.check_skip.outputs.skip == 'true'
        run: |
          echo "## ⏭️ Release Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release was skipped due to \`[skip release]\` or \`[no release]\` in commit message." >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Release Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The release workflow failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Common issues:" >> $GITHUB_STEP_SUMMARY
          echo "- Tag already exists (race condition)" >> $GITHUB_STEP_SUMMARY
          echo "- Version parsing error" >> $GITHUB_STEP_SUMMARY
          echo "- Insufficient permissions" >> $GITHUB_STEP_SUMMARY
